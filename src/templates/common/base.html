<!-- Base page to be utilized by all pages
contains all imports
sets the basic style of all pages
page content is filled inside the page block 
-->

{% load static %}

<!DOCTYPE html>
<html>
<style>
    .cursorHover {
        cursor: pointer;
    }
</style>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% block title %}FeupScheduleEditor{% endblock title %}</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link type="text/css" href="../../styles/style.css">
    <link type="text/css" href="../styles/schedule.css">
    <link rel="stylesheet" href="{% static './style.css' %}" />
    <link rel="stylesheet" href="{% static './schedule.css' %}" />
    <link rel="stylesheet" href="{% static './header.css' %}">
    <link rel="stylesheet" href="{% static './jquery.dropdown.css' %}" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static './jquery.dropdown.js' %}"></script>
    <script src="{% static './editbar.js' %}"></script>
    <script src="{% static './editdocentes.js' %}"></script>

    {% csrf_token %}
</head>

<body class="text-white bg-secondary">

    {% block page %}
    {% endblock page %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!--<script src="../../js/app.js" async defer></script>-->
    {% include './logoutPopup.html' %}
</body>

</html>
