<!-- new project popup modal -->

<div class="container">
    <!-- Modal -->
    <div class="modal fade" id="createPopup" tabindex="-1" aria-labelledby="createPopupLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-black" id="createPopupLabel">New Project</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form method="post" id="createProjectForm">
                    {% csrf_token %}
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="name" class="col-form-label text-black">Project Name:</label>
                            <input
                                required="required"
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                maxlength="20"
                            />
                            <div id="name-error-container"></div>
                        </div>
                        <div class="mb-3">
                            <label for="url" class="col-form-label text-black">Schedule Link:</label>
                            <input required="required" type="text" class="form-control" id="url" name="url" />
                            <div id="url-error-container"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="cancelBtn" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="submitBtn">Create Project</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        $("#createProjectForm").submit(function (event) {
            event.preventDefault();

            const projectName = $("#name").val();
            const scheduleUrl = $("#url").val();
            const nameError = $("#name-error-container");
            const urlError = $("#url-error-container");

            nameError.empty();
            urlError.empty();

            let valid = true;

            if (projectName.length > 20) {
                nameError.append('<p class="text-danger">Name must be 20 characters or fewer.</p>');
                valid = false;
            } else if (!/^[a-zA-Z0-9 _-]+$/.test(projectName)) {
                nameError.append(
                    '<p class="text-danger">Name may only contain letters, numbers, spaces, hyphens, and underscores.</p>',
                );
                valid = false;
            }

            try {
                const parsed = new URL(scheduleUrl);
                if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
                    throw new Error();
                }
            } catch {
                urlError.append(
                    '<p class="text-danger">Invalid URL. It must be a valid http:// or https:// address.</p>',
                );
                valid = false;
            }

            if (!valid) return;

            $("#name, #url, #cancelBtn, #submitBtn").prop("disabled", true);
            $("#submitBtn").html('<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Creating...');

            $.ajax({
                data: $(this).serialize(),
                type: $(this).attr("method"),
                url: "/projects/",
                success: function () {
                    window.location.reload();
                },
                error: function (response) {
                    $("#name, #url, #cancelBtn, #submitBtn").prop("disabled", false);
                    $("#submitBtn").text("Create Project");
                    alert(response.responseText);
                    console.log(response.responseText);
                },
            });

            return false;
        });
    });
</script>
