[project]
name = "horarios-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4==4.15.0",
    "daphne==4.2.2",
    "django==6.0.6",
    "pydantic==2.13.4",
    "requests==2.34.2",
    "sqlalchemy==2.0.50",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "django-livereload-server==0.5.1",
    "django-stubs==6.0.5",
    "pre-commit==4.6.0",
    "ruff==0.15.17",
]

[tool.ruff]
src = ["."]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize Python syntax)
    "B",   # flake8-bugbear (common bugs and design issues)
    "C4",  # flake8-comprehensions (better list/dict/set comprehensions)
    "COM", # flake8-commas (enforce trailing commas)
    "DJ",  # flake8-django (Django-specific checks)
    "SIM", # flake8-simplify (simplifiable code patterns)
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by the formatter
    "SIM108", # ternary operator — not always more readable
]

[tool.ruff.lint.per-file-ignores]
# Django split-settings: dev.py / prod.py intentionally star-import from base.py
"src/config/settings/*.py" = ["F403", "F405"]
# Django-generated migrations: `dependencies` / `operations` are framework-defined
"src/**/migrations/*.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
djangoSettings = "src.config.settings"
typeCheckingMode = "strict"
deprecateTypingAliases = true
enableReachabilityAnalysis = true
strictDictionaryInference = true
strictListInference = true
strictSetInference = true
