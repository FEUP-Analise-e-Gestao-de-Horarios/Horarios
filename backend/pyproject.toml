[project]
name = "horarios-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bleach",
    "bs4",
    "daphne",
    "django",
    "matplotlib",
    "networkx",
    "pydantic",
    "readerwriterlock",
    "requests",
    "six",
    "sqlalchemy",
    "unicode",
    "whitenoise",
]

[dependency-groups]
dev = [
    "django-livereload-server",
    "django-stubs",
    "pre-commit",
    "ruff",
]

[tool.ruff]
src = ["."]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernise Python syntax)
    "B",   # flake8-bugbear (common bugs and design issues)
    "C4",  # flake8-comprehensions (better list/dict/set comprehensions)
    "COM", # flake8-commas (enforce trailing commas)
    "DJ",  # flake8-django (Django-specific checks)
    "SIM", # flake8-simplify (simplifiable code patterns)
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by the formatter
    "SIM108", # ternary operator — not always more readable
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
djangoSettings = "src.config.settings"
typeCheckingMode = "strict"
deprecateTypingAliases = true
enableReachabilityAnalysis = true
strictDictionaryInference = true
strictListInference = true
strictSetInference = true
