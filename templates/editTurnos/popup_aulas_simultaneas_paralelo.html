<style>
    .botao-popup {
        padding: 10px;
        border: none;
        border-radius: 10px;
        transition: background-color 0.2s;
        cursor: pointer;
    }

    .botao-popup:hover {
        background-color: #ffc107;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }
    .popup-paralelo-simultanea{
        display:none; 
        position: fixed; 
        z-index: 2000; 
        background: white; 
        border-radius: 10px;
        padding: 20px; width: 400px; 
        top: 30%; 
        left: 50%; 
        transform: translate(-50%, -50%); 
        box-shadow: 0 0 10px rgba(0,0,0,0.3); 
        overflow: auto;
    }
</style>

<div id="popup-paralelo" class="popup-paralelo-simultanea">
    <p style="color:black;">Esta alteração afeta aulas em paralelo.</p>
    <p style="color:black;">As aulas envolvidas no grupo são as seguintes:</p>
    <p style="color:black;">Selecione o que deseja realizar.</p>

    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
        <button class="botao-popup" onclick="escolherOpcaoParalelo('so-esta')">Alterar apenas esta aula</button>
        <button class="botao-popup" onclick="escolherOpcaoParalelo('todas')">Alterar nas restantes aulas também</button>
        <button class="botao-popup" onclick="escolherOpcaoParalelo('cancelar')">Cancelar alteração</button>
    </div>
</div>

<div id="popup-simultanea"  class="popup-paralelo-simultanea">
    <p style="color:black;">Esta alteração afeta aulas em simultâneo.</p>
    <p style="color:black;">As aulas envolvidas no grupo são as seguintes:</p>
    <p style="color:black;">Selecione o que deseja realizar.</p>

    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
        <button class="botao-popup" onclick="escolherOpcaoSimultanea('so-esta')">Alterar apenas esta aula</button>
        <button class="botao-popup" onclick="escolherOpcaoSimultanea('todas')">Alterar nas restantes aulas também</button>
        <button class="botao-popup" onclick="escolherOpcaoSimultanea('cancelar')">Cancelar Alterações</button>
    </div>
</div>

<div id="popup-overlay"
     style="pointer-events: auto; display: none; position: fixed; z-index: 1999;
     top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.3);">
     <!-- this div is to disable clicking while the user hasn't closed the popup -->
</div>

<script>
    let callbackParalelo = null;

    function abrirPopupParalelo(callback) {
        callbackParalelo = callback;
        document.getElementById('popup-paralelo').style.display = 'block';
        document.getElementById('popup-overlay').style.display = 'block';

    }

    function escolherOpcaoParalelo(opcao) {
        document.getElementById('popup-paralelo').style.display = 'none';
        document.getElementById('popup-overlay').style.display = 'none';
        if (callbackParalelo) callbackParalelo(opcao);
    }

    let callbackSimultanea = null;

    function abrirPopupSimultanea(callback) {
        callbackSimultanea = callback;
        document.getElementById('popup-simultanea').style.display = 'block';
        document.getElementById('popup-overlay').style.display = 'block';

    }

    function escolherOpcaoSimultanea(opcao) {
        document.getElementById('popup-simultanea').style.display = 'none';
        document.getElementById('popup-overlay').style.display = 'none';
        if (callbackSimultanea) callbackSimultanea(opcao);
    }

</script>
