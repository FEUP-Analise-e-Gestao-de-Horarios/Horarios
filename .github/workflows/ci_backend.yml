name: "CI: Backend"

on:
  pull_request:

jobs:
  backend-lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uvx pre-commit run ruff --all-files

  backend-format:
    name: "Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uvx pre-commit run ruff-format --all-files
