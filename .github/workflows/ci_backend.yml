name: "CI: Backend"

on:
  pull_request:
  merge_group:

jobs:
  backend-lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx pre-commit run ruff --all-files

  backend-format:
    name: "Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx pre-commit run ruff-format --all-files

  backend-test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: cd backend && uv sync
      - run: cd backend && uv run pytest
