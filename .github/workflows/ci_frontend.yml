name: "CI: Frontend"

on:
  pull_request:

jobs:
  frontend-typecheck:
    name: "Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
      - run: cd frontend && npm install
      - run: uvx pre-commit run frontend-typecheck --all-files

  frontend-lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
      - run: cd frontend && npm install
      - run: uvx pre-commit run frontend-lint --all-files

  frontend-format:
    name: "Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
      - run: cd frontend && npm install
      - run: uvx pre-commit run frontend-format --all-files

  frontend-test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: cd frontend && npm install
      - run: cd frontend && npm run test
