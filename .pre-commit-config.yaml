repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      # Format code and auto-fix safe issues (unused imports, etc.)
      - id: ruff
        name: ruff (fix)
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/

      # Lint-only pass — fail if any violations remain after fixing
      - id: ruff-format
        name: ruff (format)
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-check
        name: frontend check (tsc + eslint + prettier)
        language: system
        entry: bash -c 'cd frontend && npm run check'
        pass_filenames: false
        files: ^frontend/
